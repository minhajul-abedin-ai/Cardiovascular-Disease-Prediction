name: Validate experimental Python 3.11 direct constraints
on:
  pull_request:
    paths:
      - 'constraints/python311-direct-candidate.txt'
      - '.github/workflows/validate-direct-constraints.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Report interpreter and installer
        run: |
          python --version
          python -m pip --version
      - name: Install with experimental constraints
        run: python -m pip install -r requirements.txt -c constraints/python311-direct-candidate.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest -q
      - name: Compile source and tests
        run: python -m compileall -q src tests scripts
      - name: Record resolved environment
        run: python -m pip freeze
